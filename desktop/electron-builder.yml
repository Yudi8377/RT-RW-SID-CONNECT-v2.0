appId: id.akvisio.rtrw.sidconnect
productName: RT-RW-SID CONNECT
artifactName: RT-RW-SID-CONNECT-v2.0-Setup-${version}.${ext}
directories:
  output: dist
  buildResources: build
files:
  - from: ../
    to: .
    filter:
      - "**/*"
      - "!desktop/node_modules/**"
      - "!desktop/dist/**"
      - "!.git/**"
      - "!28_DOCUMENTATION/**"
extraMetadata:
  main: desktop/main.cjs
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: RT-RW-SID-CONNECT-v2.0-Setup-${version}.exe
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: RT/RW-SID CONNECT
  uninstallDisplayName: RT/RW-SID CONNECT v2.0
