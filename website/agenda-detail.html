<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Detail Agenda Warga — Smart Village / Desa Cerdas Engine">
<title>Agenda Warga — Smart Village</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="./theme.css?v=agenda-detail-20261001-r2">
<style>
.detail-shell{min-height:100vh;padding:42px 0 80px;background:linear-gradient(180deg,#f6f8f5 0%,#fff 55%)}.detail-card{max-width:960px;margin:0 auto;background:#fff;border:1px solid rgba(20,35,30,.1);border-radius:28px;padding:42px;box-shadow:0 24px 70px rgba(20,35,30,.08)}.detail-meta{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}.detail-chip{padding:8px 13px;border-radius:999px;background:#eef4ef;font-size:.85rem;font-weight:700}.detail-title{font:800 clamp(2rem,5vw,4rem)/1.05 Manrope,sans-serif;margin:12px 0}.detail-copy{font-size:1.08rem;line-height:1.75;color:#56645e}.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:30px 0}.detail-box{padding:18px;border-radius:18px;background:#f5f7f5}.detail-box small{display:block;color:#718078;text-transform:uppercase;font-size:.72rem;font-weight:700;margin-bottom:7px}.detail-box strong{display:block;line-height:1.45}.agenda-map{margin-top:30px;border:1px solid rgba(20,35,30,.1);border-radius:22px;overflow:hidden;background:#f5f7f5}.agenda-map iframe{display:block;width:100%;height:380px;border:0}.agenda-map-caption{display:flex;gap:12px;align-items:center;padding:16px 18px}.agenda-map-caption i{font-size:1.3rem}.agenda-map-caption span{display:flex;flex-direction:column;gap:3px}.agenda-map-caption small{color:#68766f}.detail-section{margin-top:30px;padding-top:25px;border-top:1px solid rgba(20,35,30,.1)}.detail-section h2{font:700 1.35rem Manrope,sans-serif}.detail-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}.back-link{display:inline-flex;align-items:center;gap:8px;margin-bottom:25px;text-decoration:none}.error-box{padding:24px;border-radius:18px;background:#fff3f1;color:#7d3028}@media(max-width:700px){.detail-card{padding:24px;border-radius:20px}.detail-grid{grid-template-columns:1fr}.detail-title{font-size:2.2rem}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script>
</head>
<body>
<main class="detail-shell"><div class="container-xl">
<a class="back-link" href="./index.html#agenda"><i class="bi bi-arrow-left"></i> Kembali ke Agenda Warga</a>
<article id="detail" class="detail-card"><div class="modal-note">Memuat detail agenda…</div></article>
</div></main>
<script>
(async()=>{
  const box=document.getElementById("detail");
  const params=new URLSearchParams(location.search);
  const id=params.get("id")||params.get("agenda_id");
  const SUPABASE_URL=window.APP_CONFIG?.supabaseUrl||"https://gzdusguveeeflmlvvmwe.supabase.co";
  const KEY=window.APP_CONFIG?.supabasePublishableKey||"sb_publishable_nSqPHZf1-1CAJMFNmrpNqA_lafobeV-";
  const territory_id="f06b8420-54f5-4ee4-b487-bacc7b374dd2";
  const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  try{
    if(!id)throw new Error("ID agenda tidak ditemukan.");
    const sb=window.supabase.createClient(SUPABASE_URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    const r=await sb.functions.invoke("public-experience",{body:{action:"agenda_list",territory_id}});
    if(r.error||!r.data?.ok)throw new Error(r.data?.error||r.error?.message||"Gagal memuat agenda.");
    const x=(r.data.records||[]).find(v=>String(v.id??v.agenda_id??v.event_id)===String(id));
    if(!x)throw new Error("Agenda tidak ditemukan atau belum dipublikasikan.");
    const d=new Date(x.event_date+"T00:00:00");
    const date=d.toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
    const tm=x.start_at?new Date(x.start_at).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit",hour12:false})+" WIB":"Waktu belum ditentukan";
    const name=x.title||x.name||"Agenda Warga";
    const type=String(x.event_type||"AGENDA").replaceAll("_"," ");
    const description=x.description||x.summary||x.notes||"Kegiatan warga yang ditandai dapat dipublikasikan oleh tata kelola desa.";
    const notes=x.notes&&x.notes!==description?x.notes:"Data publik berasal dari kegiatan yang telah ditandai dapat dipublikasikan oleh tata kelola desa.";
    const status=x.status||"PLANNED";
    const source=x.source_data||"SIM RT/RW · Public Experience";
    const territory=x.territory||"Desa Demo · PILOT-DESA";
    const organizer=x.organizer||"Pemerintah Desa / Tata Kelola Desa";
    const mapQuery=String(x.location||"Desa Demo, Depok, Jawa Barat");
    const mapEmbed="https://www.google.com/maps?q="+encodeURIComponent(mapQuery)+"&output=embed";
    const mapLink="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(mapQuery);
    const publicVisible=x.public_visible_label||String(Boolean(x.public_visible)).toUpperCase();
    box.innerHTML=`
      <span class="eyebrow dark">AGENDA WARGA · DETAIL</span>
      <h1 class="detail-title">${esc(name)}</h1>
      <p class="detail-copy">${esc(description)}</p>
      <div class="detail-meta">
        <span class="detail-chip">${esc(type)}</span>
        <span class="detail-chip">${esc(status)}</span>
        <span class="detail-chip">Public Visible: ${esc(publicVisible)}</span>
      </div>
      <div class="detail-grid">
        <div class="detail-box"><small>Judul kegiatan</small><strong>${esc(name)}</strong></div>
        <div class="detail-box"><small>Deskripsi / informasi</small><strong>${esc(description)}</strong></div>
        <div class="detail-box"><small>Jenis kegiatan</small><strong>${esc(type)}</strong></div>
        <div class="detail-box"><small>Status</small><strong>${esc(status)}</strong></div>
        <div class="detail-box"><small>Tanggal</small><strong>${esc(date)}</strong></div>
        <div class="detail-box"><small>Waktu</small><strong>${esc(tm)}</strong></div>
        <div class="detail-box"><small>Lokasi</small><strong>${esc(x.location||"Lokasi belum ditentukan")}</strong></div>
        <div class="detail-box"><small>Penyelenggara</small><strong>${esc(organizer)}</strong></div>
        <div class="detail-box"><small>Wilayah</small><strong>${esc(territory)}</strong></div>
        <div class="detail-box"><small>Sumber data</small><strong>${esc(source)}</strong></div>
        <div class="detail-box"><small>ID agenda</small><strong>${esc(x.agenda_id||x.id)}</strong></div>
        <div class="detail-box"><small>Status publikasi</small><strong>${esc(publicVisible)}</strong></div>
        <div class="detail-box"><small>Catatan tata kelola</small><strong>${esc(notes)}</strong></div>
      </div>
      <section class="detail-section agenda-map-section">
        <h2>Lokasi kegiatan</h2>
        <div class="agenda-map">
          <iframe id="agendaMapFrame" title="Google Maps lokasi agenda" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
          <div class="agenda-map-caption">
            <i class="bi bi-geo-alt-fill"></i>
            <span><strong id="agendaMapLabel">Memuat lokasi…</strong><small>Peta menggunakan lokasi agenda yang dipublikasikan oleh tata kelola desa.</small></span>
            <a id="agendaMapLink" class="btn btn-outline-civic btn-sm ms-auto" target="_blank" rel="noopener">Buka Google Maps</a>
          </div>
        </div>
      </section>
      <section class="detail-section">
        <h2>Informasi untuk warga</h2>
        <p class="detail-copy">Agenda ini berasal dari data kegiatan SIM RT/RW yang ditandai dapat dipublikasikan oleh tata kelola desa. Halaman publik tidak menampilkan identitas pribadi, dokumen internal, atau data operasional terbatas.</p>
        <div class="detail-grid">
          <div class="detail-box"><small>Yang perlu diketahui</small><strong>Tanggal, waktu, lokasi, jenis kegiatan, dan status agenda.</strong></div>
          <div class="detail-box"><small>Asal informasi</small><strong>Data kegiatan yang telah melewati tata kelola publikasi desa.</strong></div>
          <div class="detail-box"><small>Hubungan sistem</small><strong>SIM RT/RW → Public Experience → Agenda Warga.</strong></div>
        </div>
      </section>
      <script>
        document.getElementById("agendaMapFrame").src="PLACEHOLDER".replace("PLACEHOLDER", mapEmbed);
        document.getElementById("agendaMapLink").href=mapLink;
        document.getElementById("agendaMapLabel").textContent=mapQuery;
      </script>
      <div class="detail-actions">
        <a class="btn btn-civic" href="./index.html#agenda"><i class="bi bi-calendar-event me-1"></i>Kembali ke Agenda</a>
        <a class="btn btn-outline-civic" href="./index.html"><i class="bi bi-house me-1"></i>Home Smart Village</a>
      </div>`;
  }catch(e){
    box.innerHTML='<div class="error-box"><strong>Agenda belum dapat ditampilkan.</strong><p>'+esc(e.message||"Terjadi kesalahan")+'</p><a class="btn btn-civic" href="./index.html#agenda">Kembali ke Agenda</a></div>';
  }
})();
</script>
</body></html>
