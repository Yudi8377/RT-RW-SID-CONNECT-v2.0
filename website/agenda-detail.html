<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Detail Agenda Warga — Smart Village / Desa Cerdas Engine">
<title>Agenda Warga — Smart Village</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="./theme.css">
<style>
.detail-shell{min-height:100vh;padding:42px 0 80px;background:linear-gradient(180deg,#f6f8f5 0%,#fff 55%)}.detail-card{max-width:900px;margin:0 auto;background:#fff;border:1px solid rgba(20,35,30,.1);border-radius:28px;padding:42px;box-shadow:0 24px 70px rgba(20,35,30,.08)}.detail-meta{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}.detail-chip{padding:8px 13px;border-radius:999px;background:#eef4ef;font-size:.85rem;font-weight:700}.detail-title{font:800 clamp(2rem,5vw,4rem)/1.05 Manrope,sans-serif;margin:12px 0}.detail-copy{font-size:1.08rem;line-height:1.75;color:#56645e}.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:30px 0}.detail-box{padding:18px;border-radius:18px;background:#f5f7f5}.detail-box small{display:block;color:#718078;text-transform:uppercase;font-size:.72rem;font-weight:700;margin-bottom:7px}.detail-box strong{display:block}.back-link{display:inline-flex;align-items:center;gap:8px;margin-bottom:25px;text-decoration:none}.error-box{padding:24px;border-radius:18px;background:#fff3f1;color:#7d3028}@media(max-width:700px){.detail-card{padding:24px;border-radius:20px}.detail-grid{grid-template-columns:1fr}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script>
</head>
<body>
<main class="detail-shell"><div class="container-xl">
<a class="back-link" href="./index.html#agenda"><i class="bi bi-arrow-left"></i> Kembali ke Agenda Warga</a>
<article id="detail" class="detail-card"><div class="modal-note">Memuat detail agenda…</div></article>
</div></main>
<script>
(async()=>{const box=document.getElementById("detail");const id=new URLSearchParams(location.search).get("id");const SUPABASE_URL=window.APP_CONFIG?.supabaseUrl||"https://gzdusguveeeflmlvvmwe.supabase.co";const KEY=window.APP_CONFIG?.supabasePublishableKey||"sb_publishable_nSqPHZf1-1CAJMFNmrpNqA_lafobeV-";try{if(!id)throw new Error("ID agenda tidak ditemukan");const sb=window.supabase.createClient(SUPABASE_URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const territory_id="f06b8420-54f5-4ee4-b487-bacc7b374dd2";const r=await sb.functions.invoke("public-experience",{body:{action:"agenda_list",territory_id}});if(r.error||!r.data?.ok)throw new Error(r.data?.error||r.error?.message||"Gagal memuat agenda");const x=(r.data.records||[]).find(v=>String(v.id)===String(id));if(!x)throw new Error("Agenda tidak ditemukan atau belum dipublikasikan");const d=new Date(x.event_date+"T00:00:00");const date=d.toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});const tm=x.start_at?new Date(x.start_at).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit",hour12:false})+" WIB":"Waktu belum ditentukan";const end=x.end_at?new Date(x.end_at).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit",hour12:false})+" WIB":"";box.innerHTML='<span class="eyebrow dark">AGENDA WARGA · DETAIL</span><h1 class="detail-title">'+x.name+'</h1><p class="detail-copy">'+(x.description||x.summary||"Kegiatan warga yang telah ditandai dapat dipublikasikan oleh tata kelola desa.")+'</p><div class="detail-meta"><span class="detail-chip">'+String(x.event_type||"AGENDA").replaceAll("_"," ")+'</span><span class="detail-chip">'+(x.status||"PLANNED")+'</span><span class="detail-chip">Disetujui untuk publik</span></div><div class="detail-grid"><div class="detail-box"><small>Tanggal</small><strong>'+date+'</strong></div><div class="detail-box"><small>Waktu</small><strong>'+tm+(end?" – "+end:"")+'</strong></div><div class="detail-box"><small>Lokasi</small><strong>'+((x.location||"Lokasi belum ditentukan"))+'</strong></div><div class="detail-box"><small>Penyelenggara</small><strong>'+((x.organizer||"Pemerintah Desa / Tata Kelola Desa"))+'</strong></div><div class="detail-box"><small>Wilayah</small><strong>'+((x.territory_name||"Wilayah Desa"))+'</strong></div><div class="detail-box"><small>Sumber</small><strong>SIM RT/RW · Public Experience</strong></div></div><div class="detail-copy"><strong>Informasi kegiatan</strong><p>Agenda ini berasal dari data kegiatan yang ditandai dapat dipublikasikan oleh tata kelola desa. Data publik tetap mengikuti batas privasi dan kewenangan SIM RT/RW.</p></div>'}catch(e){box.innerHTML='<div class="error-box"><strong>Agenda belum dapat ditampilkan.</strong><p>'+String(e.message||"Terjadi kesalahan")+'</p><a class="btn btn-civic" href="./index.html#agenda">Kembali ke Agenda</a></div>'}})();
</script>
</body></html>
