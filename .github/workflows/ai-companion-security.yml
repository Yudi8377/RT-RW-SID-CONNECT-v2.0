name: AI Companion Authorization Tests

on:
  pull_request:
    paths:
      - "supabase/functions/ai-companion/**"
      - ".github/workflows/ai-companion-security.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/functions/ai-companion/**"
      - ".github/workflows/ai-companion-security.yml"

permissions:
  contents: read

jobs:
  authorization-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run authorization tests
        run: deno test supabase/functions/ai-companion/authorization.test.ts
      - name: Format check
        run: deno fmt --check supabase/functions/ai-companion/authorization.ts supabase/functions/ai-companion/authorization.test.ts
