name: AI Companion Authorization Tests

on:
  pull_request:
    paths:
      - "supabase/functions/ai-companion/**"
      - "scripts/check-ai-companion-input.sh"
      - ".github/workflows/ai-companion-security.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/functions/ai-companion/**"
      - "scripts/check-ai-companion-input.sh"
      - ".github/workflows/ai-companion-security.yml"

permissions:
  contents: read

jobs:
  authorization-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Function
        run: deno check supabase/functions/ai-companion/index.ts
      - name: Run authorization tests
        run: deno test supabase/functions/ai-companion/authorization.test.ts
      - name: Check AI input-hardening invariants
        run: bash scripts/check-ai-companion-input.sh
