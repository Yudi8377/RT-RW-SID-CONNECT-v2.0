name: Subscription Trial Quality

on:
  pull_request:
    paths:
      - "app.js"
      - "supabase/functions/start-trial/**"
      - "supabase/functions/register-device/**"
      - "supabase/functions/_shared/device.*"
      - "supabase/migrations/202610230001_server_authoritative_entitlements.sql"
      - "supabase/migrations/202610230002_device_entitlement_enforcement.sql"
      - "supabase/migrations/202610230005_trial_14_days.sql"
      - "supabase/migrations/20261024125347_trial_7_day_reconciliation.sql"
      - "supabase/migrations/202610260001_restore_seven_day_trial.sql"
      - "supabase/tests/**"
      - ".github/workflows/subscription-trial-quality.yml"
  push:
    branches:
      - feat/server-entitlements-schema-v1
      - main
    paths:
      - "app.js"
      - "supabase/functions/start-trial/**"
      - "supabase/functions/register-device/**"
      - "supabase/migrations/202610230001_server_authoritative_entitlements.sql"
      - "supabase/migrations/202610230002_device_entitlement_enforcement.sql"
      - "supabase/migrations/202610230005_trial_14_days.sql"
      - "supabase/migrations/20261024125347_trial_7_day_reconciliation.sql"
      - "supabase/migrations/202610260001_restore_seven_day_trial.sql"
      - "supabase/tests/**"
      - ".github/workflows/subscription-trial-quality.yml"

permissions:
  contents: read

jobs:
  trial-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check trial and device Edge Functions
        run: deno check supabase/functions/start-trial/index.ts supabase/functions/register-device/index.ts
      - name: Test shared device identity hashing
        run: deno test supabase/functions/_shared/device.test.ts
      - name: Test trial authorization policy and dates
        run: deno test supabase/functions/start-trial/policy.test.ts
      - name: Guard fail-closed subscription expiry behavior
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'if(!current.length)return {blocked:true,message:"Tidak ada langganan aktif untuk organisasi ini.' app.js
          grep -Fq 'if(result.error)return {blocked:true,message:"Status langganan dan perangkat tidak dapat diverifikasi.' app.js
          echo "Subscription expiry and verification failures fail closed."
      - name: Guard server-authoritative trial invariants
        shell: bash
        run: |
          set -euo pipefail
          file="supabase/functions/start-trial/index.ts"
          grep -q 'auth.getUser()' "$file"
          grep -q 'SUPABASE_SERVICE_ROLE_KEY' "$file"
          migration="supabase/migrations/202610230001_server_authoritative_entitlements.sql"
          device_migration="supabase/migrations/202610230002_device_entitlement_enforcement.sql"
          restore_migration="supabase/migrations/202610260001_restore_seven_day_trial.sql"
          grep -q 'admin.rpc("start_organization_trial_with_device"' "$file"
          grep -q 'organization_devices' "$device_migration"
          grep -q 'DEVICE_LIMIT_REACHED' "$device_migration"
          grep -q 'grant execute on function public.register_organization_device(uuid,uuid,text,text) to service_role' "$device_migration"
          grep -q 'grant execute on function public.start_organization_trial_with_device(uuid,uuid,text,text,text) to service_role' "$device_migration"
          grep -q "('TRIAL_7_DAY', 'Trial 7 Hari', 'TRIAL', 7, 0, 'IDR', true" "$migration"
          grep -q "'device_limit', true, 1" "$migration"
          grep -q "where p.plan_code = 'TRIAL_7_DAY'" "$migration"
          grep -q "interval '7 days'" "$migration"
          grep -q "join public.roles r on r.id = ra.role_id" "$migration"
          grep -q "'RT_OPERATOR', 'RW_REVIEWER', 'VILLAGE_VALIDATOR'" "$migration"
          grep -q "'TRIALING'" "$migration"
          grep -q "'SYSTEM_TRIAL'" "$migration"
          grep -q 'subscription_audit_events' "$migration"
          grep -q 'revoke all on function public.start_organization_trial(uuid, uuid, text) from public, anon, authenticated' "$migration"
          grep -q 'grant execute on function public.start_organization_trial(uuid, uuid, text) to service_role' "$restore_migration"
          grep -q "display_name = 'Trial 7 Hari'" "$restore_migration"
          grep -q "duration_days = 7" "$restore_migration"
          grep -q "interval '7 days'" "$restore_migration"
          if grep -Eq 'body\.(plan_id|price_amount|status|trial_ends_at|activation_source)' "$file"; then
            echo "Client-controlled entitlement fields detected" >&2
            exit 1
          fi
          echo "Server-authoritative trial invariants passed."

  production-auth-boundary:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify trial and device endpoints reject unauthenticated requests
        shell: bash
        run: |
          set -euo pipefail
          key="$(sed -n 's/.*supabasePublishableKey:"\([^"]*\)".*/\1/p' config.js)"
          test -n "$key"
          for endpoint in start-trial register-device; do
            code="$(curl --silent --show-error --output /tmp/"$endpoint".json --write-out '%{http_code}' \
              -X POST "https://gzdusguveeeflmlvvmwe.supabase.co/functions/v1/$endpoint" \
              -H "apikey: $key" -H 'Content-Type: application/json' --data '{}')"
            if [ "$code" != "401" ]; then
              echo "$endpoint must reject unauthenticated request with HTTP 401; got $code" >&2
              cat /tmp/"$endpoint".json >&2
              exit 1
            fi
          done
          echo "Production Edge Functions reject unauthenticated trial/device requests."

  migration-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create disposable Supabase-compatible base schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/entitlements-test-bootstrap.sql
      - name: Add active organization state to disposable base schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "ALTER TABLE public.organizations ADD COLUMN active boolean NOT NULL DEFAULT true;"
      - name: Apply entitlement migration to disposable database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/202610230001_server_authoritative_entitlements.sql
      - name: Apply device entitlement migration to disposable database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/202610230002_device_entitlement_enforcement.sql
      - name: Apply trial duration update to disposable database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/202610230005_trial_14_days.sql
      - name: Apply forward-only seven-day reconciliation to disposable database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261024125347_trial_7_day_reconciliation.sql
      - name: Apply final seven-day trial restoration to disposable database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/202610260001_restore_seven_day_trial.sql
      - name: Verify trial lifecycle, device limits, grants, and tenant isolation
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/entitlements-migration-smoke.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF (SELECT duration_days FROM public.subscription_plans WHERE plan_code = 'TRIAL_7_DAY') <> 7 THEN RAISE EXCEPTION 'trial duration must be 7 days'; END IF; IF (SELECT display_name FROM public.subscription_plans WHERE plan_code = 'TRIAL_7_DAY') <> 'Trial 7 Hari' THEN RAISE EXCEPTION 'trial display name is not canonical'; END IF; IF pg_get_functiondef('public.start_organization_trial(uuid,uuid,text)'::regprocedure) NOT LIKE '%duration_days = 7%' THEN RAISE EXCEPTION 'trial function is not configured for 7 days'; END IF; END \$\$;"
