name: Android Test APK

on:
  push:
    branches:
      - main
      - 'feat/android-apk-test-build-v1'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: android/package.json

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive --no-install

      - name: Build release APK
        working-directory: android/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s android/android/app/build/outputs/apk/release/app-release.apk
          sha256sum android/android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rt-rw-sid-connect-android-test-v1
          path: android/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
