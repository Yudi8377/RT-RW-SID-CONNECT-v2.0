name: Regional admin workspace smoke tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'app.js'
      - 'form-registry.js'
      - 'scripts/validate-form-registry.mjs'
      - 'docs/FORMULIR-DAN-RUJUKAN-REGULASI.md'
      - 'scripts/check-admin-workspaces.mjs'
      - 'scripts/check-demo-trial.mjs'
      - 'docs/ADMIN-WORKSPACE-MATRIX.md'
      - '.github/workflows/admin-workspaces-quality.yml'
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'scripts/check-admin-workspaces.mjs'
      - 'docs/ADMIN-WORKSPACE-MATRIX.md'
      - '.github/workflows/admin-workspaces-quality.yml'

permissions:
  contents: read

jobs:
  admin-workspaces:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify demo trial duration and local-only write boundaries
        run: node scripts/check-demo-trial.mjs
      - name: Verify JavaScript syntax
        run: node --check app.js
      - name: Verify separate regional admin workspaces and protected preview
        run: node scripts/check-admin-workspaces.mjs
      - name: Verify specific regulatory form schemas for every menu
        run: node scripts/validate-form-registry.mjs
