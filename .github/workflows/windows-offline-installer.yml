name: Windows Offline Installer

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub release from this verified installer build"
        required: true
        default: false
        type: boolean
      release_version:
        description: "Release tag/version, e.g. v2.0.1"
        required: false
        default: "v2.0.1"
        type: string
  push:
    branches: ["offline-windows-installer-v1", "hardening-v2.0.1", "qa/windows-acceptance-harness-v1"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Install desktop build dependencies
        working-directory: desktop
        run: npm install

      - name: Dependency security audit
        working-directory: desktop
        shell: powershell
        run: |
          npm audit --json | Tee-Object audit-report.json
          if ($LASTEXITCODE -ne 0) { throw "npm audit found vulnerabilities at high severity or above." }

      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RT-RW-SID-CONNECT-v2.0-Dependency-Audit
          path: desktop/audit-report.json
          if-no-files-found: warn

      - name: Validate offline runtime sources
        working-directory: desktop
        shell: powershell
        run: |
          node --check main.cjs
          node --check local-db.cjs
          node --check preload.cjs
          if (-not (Test-Path offline-shell.html)) { throw "offline-shell.html missing" }
          if (-not (Test-Path ..\offline-data\supabase-snapshot-v1.0\master-data.json)) { throw "offline seed package missing" }
          node test-offline-runtime.cjs
          node test-offline-queue-policy.cjs
          node test-offline-migration-recovery.cjs

      - name: Build Windows installer
        working-directory: desktop
        run: npx electron-builder --win nsis --config electron-builder.yml

      - name: Generate SHA-256
        working-directory: desktop
        shell: powershell
        run: |
          $exe = Get-ChildItem dist\*.exe | Select-Object -First 1
          if (-not $exe) { throw "Windows installer EXE not found." }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Set-Content -Encoding ascii "dist\$($exe.Name).sha256"

      - name: Install and launch acceptance
        working-directory: desktop
        shell: powershell
        run: node test-windows-installer-acceptance.cjs

      - name: Upload Windows acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RT-RW-SID-CONNECT-v2.0-Windows-Acceptance-Evidence
          path: windows-acceptance-report.json
          if-no-files-found: warn

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: RT-RW-SID-CONNECT-v2.0-Windows-Offline
          path: |
            desktop/dist/*.exe
            desktop/dist/*.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release == true }}
        working-directory: desktop
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          $exe = Get-ChildItem dist\*.exe | Select-Object -First 1
          $checksum = Get-ChildItem dist\*.sha256 | Select-Object -First 1
          if (-not $exe) { throw "Release EXE not found." }
          if (-not $checksum) { throw "Release checksum not found." }
          if (-not $env:RELEASE_VERSION) { throw "Release version is required." }
          gh release view "$env:RELEASE_VERSION" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $env:RELEASE_VERSION already exists. Choose a new release_version." }
          gh release create "$env:RELEASE_VERSION" $exe.FullName $checksum.FullName `
            --target "${{ github.sha }}" `
            --title "RT/RW-SID CONNECT $env:RELEASE_VERSION" `
            --notes "Windows Offline Installer $env:RELEASE_VERSION. Built from commit ${{ github.sha }} after a successful build and checksum verification. This release does not modify or merge into main."
