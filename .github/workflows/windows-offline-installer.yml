name: Windows Offline Installer

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub release from this verified installer build"
        required: true
        default: false
        type: boolean
      release_version:
        description: "Release tag/version, e.g. v2.0.1"
        required: false
        default: "v2.0.1"
        type: string
  push:
    branches: ["offline-windows-installer-v1", "hardening-v2.0.1", "qa/windows-acceptance-harness-v1", "fix/windows-os-shell-v2.0.1"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Install desktop build dependencies
        working-directory: desktop
        run: npm install

      - name: Dependency security audit
        working-directory: desktop
        shell: powershell
        run: |
          npm audit --json | Tee-Object audit-report.json
          if ($LASTEXITCODE -ne 0) { throw "npm audit found vulnerabilities at high severity or above." }

      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RT-RW-SID-CONNECT-v2.0-Dependency-Audit
          path: desktop/audit-report.json
          if-no-files-found: warn

      - name: Validate offline runtime sources
        working-directory: desktop
        shell: powershell
        run: |
          node --check main.cjs
          node --check local-db.cjs
          node --check preload.cjs
          if (-not (Test-Path offline-shell.html)) { throw "offline-shell.html missing" }
          if (-not (Test-Path ..\offline-data\supabase-snapshot-v1.0\master-data.json)) { throw "offline seed package missing" }
          node test-offline-runtime.cjs
          node test-offline-queue-policy.cjs
          node test-offline-migration-recovery.cjs

      - name: Build Windows installer
        working-directory: desktop
        run: npx electron-builder --win nsis --config electron-builder.yml

      - name: Generate SHA-256
        working-directory: desktop
        shell: powershell
        run: |
          $exe = Get-ChildItem dist\*.exe | Select-Object -First 1
          if (-not $exe) { throw "Windows installer EXE not found." }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Set-Content -Encoding ascii "dist\$($exe.Name).sha256"

      - name: Install and launch acceptance
        working-directory: desktop
        shell: powershell
        run: node test-windows-installer-acceptance.cjs

      - name: Upload Windows acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RT-RW-SID-CONNECT-v2.0-Windows-Acceptance-Evidence
          path: windows-acceptance-report.json
          if-no-files-found: warn

      - name: Assemble release documentation bundle
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force release-bundle\documentation | Out-Null
          Copy-Item 28_DOCUMENTATION\RELEASE\V2.0.1\*.md release-bundle\documentation\ -Force
          Copy-Item 28_DOCUMENTATION\RELEASE\v2.0.1-WINDOWS-MANUAL-ACCEPTANCE-RUNBOOK.md release-bundle\ -Force
          Copy-Item 28_DOCUMENTATION\RELEASE\Invoke-v2.0.1-Windows-Manual-Acceptance.ps1 release-bundle\ -Force
          Copy-Item 28_DOCUMENTATION\RELEASE\V2.0.1-FINAL-WINDOWS-ACCEPTANCE-BLOCKER.md release-bundle\ -Force -ErrorAction SilentlyContinue
          Set-Content release-bundle\README.txt 'RT/RW-SID CONNECT v2.0.1 Windows Offline Release Bundle - Installer + SHA-256 + documentation. Release remains subject to A1-A16 acceptance.'

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: RT-RW-SID-CONNECT-v2.0.1-Windows-Release-Bundle
          path: |
            desktop/dist/*.exe
            desktop/dist/*.sha256
            release-bundle/**
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: RT-RW-SID-CONNECT-v2.0-Windows-Offline
          path: |
            desktop/dist/*.exe
            desktop/dist/*.sha256
          if-no-files-found: error

      - name: Enforce release acceptance gate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release == true }}
        shell: powershell
        run: |
          if (-not (Test-Path windows-acceptance-report.json)) {
            throw "Release blocked: Windows acceptance evidence is missing."
          }
          $report = Get-Content windows-acceptance-report.json -Raw | ConvertFrom-Json
          if (-not $report.ok) { throw "Release blocked: acceptance report is not OK." }

          $requiredGates = @(
            "A1_install",
            "A2_launch",
            "A3_offline_dependency",
            "A4_offline_shell_payload",
            "A5_local_db_created",
            "A6_local_record_operation",
            "A7_offline_queue_pending",
            "A8_restart",
            "A9_queue_persistence",
            "A10_reconnect",
            "A11_sync_replay",
            "A12_migration_recovery",
            "A13_uninstall",
            "A14_user_data_retention",
            "A15_reinstall",
            "A16_clean_first_run"
          )

          $invalid = @(
            $requiredGates | Where-Object {
              -not $report.acceptance.PSObject.Properties.Name.Contains($_) -or
              $report.acceptance.$_ -ne "PASS"
            }
          )
          if ($invalid.Count -gt 0) {
            throw "Release blocked: every A1-A16 gate must be PASS. Current non-PASS gates: $($invalid -join ', ')"
          }

          $checksum = Get-ChildItem dist\*.sha256 | Select-Object -First 1
          if (-not $checksum) { throw "Release blocked: SHA-256 checksum file is missing." }

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release == true }}
        working-directory: desktop
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          $exe = Get-ChildItem dist\*.exe | Select-Object -First 1
          $checksum = Get-ChildItem dist\*.sha256 | Select-Object -First 1
          if (-not $exe) { throw "Release EXE not found." }
          if (-not $checksum) { throw "Release checksum not found." }
          if (-not $env:RELEASE_VERSION) { throw "Release version is required." }
          gh release view "$env:RELEASE_VERSION" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $env:RELEASE_VERSION already exists. Choose a new release_version." }
          gh release create "$env:RELEASE_VERSION" $exe.FullName $checksum.FullName `
            --target "${{ github.sha }}" `
            --title "RT/RW-SID CONNECT $env:RELEASE_VERSION" `
            --notes "Windows Offline Installer $env:RELEASE_VERSION. Built from commit ${{ github.sha }} after a successful build and checksum verification. This release does not modify or merge into main."
