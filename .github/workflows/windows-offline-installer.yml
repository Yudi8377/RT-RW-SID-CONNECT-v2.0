name: Windows Offline Installer

on:
  workflow_dispatch:
  push:
    branches: ["offline-windows-installer-v1"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Install desktop build dependencies
        working-directory: desktop
        run: npm install

      - name: Build Windows installer
        working-directory: desktop
        run: npx electron-builder --win nsis --config electron-builder.yml

      - name: Generate SHA-256
        working-directory: desktop
        shell: powershell
        run: |
          $exe = Get-ChildItem dist\*.exe | Select-Object -First 1
          if (-not $exe) { throw "Windows installer EXE not found." }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Set-Content -Encoding ascii "dist\$($exe.Name).sha256"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: RT-RW-SID-CONNECT-v2.0-Windows-Offline
          path: |
            desktop/dist/*.exe
            desktop/dist/*.sha256
          if-no-files-found: error

      - name: Publish GitHub Release v2.0.0
        working-directory: desktop
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem dist\*.exe | Select-Object -First 1
          $checksum = Get-ChildItem dist\*.sha256 | Select-Object -First 1
          if (-not $exe) { throw "Release EXE not found." }
          if (-not $checksum) { throw "Release checksum not found." }

          gh release create "v2.0.0" $exe.FullName $checksum.FullName `
            --target "${{ github.sha }}" `
            --title "RT/RW-SID CONNECT v2.0.0" `
            --notes "Windows Offline Installer v2.0.0. Built and verified from commit ${{ github.sha }}. This release does not modify or merge into main."
