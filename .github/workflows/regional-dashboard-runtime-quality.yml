name: Regional dashboard RPC smoke tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/202610220002_regional_dashboard_summary_rpc.sql'
      - 'supabase/migrations/202610230003_scoped_resident_directory.sql'
      - 'supabase/migrations/202610230004_household_membership_admin_workbench.sql'
      - 'supabase/migrations/202610260002_fix_active_household_membership_window.sql'
      - 'supabase/tests/resident-membership-admin-smoke.sql'
      - 'supabase/tests/resident-directory-smoke.sql'
      - 'supabase/tests/regional-dashboard-test-bootstrap.sql'
      - 'supabase/tests/regional-dashboard-rpc-smoke.sql'
      - '.github/workflows/regional-dashboard-runtime-quality.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/202610230004_household_membership_admin_workbench.sql'
      - 'supabase/tests/resident-membership-admin-smoke.sql'
      - 'supabase/migrations/202610230003_scoped_resident_directory.sql'
      - 'supabase/tests/resident-directory-smoke.sql'
      - 'supabase/migrations/202610220002_regional_dashboard_summary_rpc.sql'
      - 'supabase/tests/regional-dashboard-test-bootstrap.sql'
      - 'supabase/tests/regional-dashboard-rpc-smoke.sql'
      - '.github/workflows/regional-dashboard-runtime-quality.yml'

permissions:
  contents: read

jobs:
  regional-rpc-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create disposable regional schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/regional-dashboard-test-bootstrap.sql
      - name: Apply regional RPC migration to disposable database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/202610220002_regional_dashboard_summary_rpc.sql
      - name: Test regional scope and least privilege
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/regional-dashboard-rpc-smoke.sql
      - name: Apply resident directory migration to disposable database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/202610230003_scoped_resident_directory.sql
      - name: Test resident directory scope and least privilege
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/resident-directory-smoke.sql
      - name: Apply household membership workbench migration to disposable database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/202610230004_household_membership_admin_workbench.sql
      - name: Apply active membership window fix to disposable database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/202610260002_fix_active_household_membership_window.sql
      - name: Test verified household membership workbench
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/resident-membership-admin-smoke.sql
