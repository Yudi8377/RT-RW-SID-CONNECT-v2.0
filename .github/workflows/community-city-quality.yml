name: Community chat and regional portal quality
on:
  pull_request:
    branches: [main]
    paths:
      - 'website/index.html'
      - 'website/community-media-chat.*'
      - 'website/kota-kabupaten/**'
      - 'supabase/migrations/202610220005_community_chat_and_video.sql'
      - 'supabase/migrations/202610220006_regional_video_moderation.sql'
      - 'supabase/migrations/202610220007_video_submission_scope.sql'
      - 'supabase/migrations/202610220008_regional_curator_scope.sql'
      - 'supabase/migrations/202610220009_public_column_grants.sql'
      - 'supabase/migrations/202610220010_community_least_privilege_grants.sql'
      - '.github/workflows/community-city-quality.yml'
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check website/community-media-chat.js
          node --check website/kota-kabupaten/portal.js
          node --check website/kota-kabupaten/admin.js
          node --check website/kota-kabupaten/governance-flow.js
      - name: Check public and admin routes
        run: |
          test -s website/kota-kabupaten/index.html
          test -s website/kota-kabupaten/admin.html
          test -s website/kota-kabupaten/governance-flow.js
          test -s website/kota-kabupaten/website-registry.json
          node -e 'const r=JSON.parse(require("fs").readFileSync("website/kota-kabupaten/website-registry.json","utf8")); if (!Array.isArray(r.websites)) throw new Error("registry.websites must be an array"); for (const x of r.websites) { if (x.status !== "verified" || typeof x.url !== "string" || !/^https:\/\//i.test(x.url)) throw new Error("registry contains an unverified or non-HTTPS URL"); }'
          test "$(grep -o 'class="cp-step cp-step-link"' website/kota-kabupaten/index.html | wc -l | tr -d ' ')" -eq 3
          grep -q 'data-governance-types="RT,RW"' website/kota-kabupaten/index.html
          grep -q 'data-governance-types="VILLAGE,DISTRICT"' website/kota-kabupaten/index.html
          grep -q 'data-governance-types="REGENCY_CITY"' website/kota-kabupaten/index.html
          grep -q 'status==="verified"' website/kota-kabupaten/portal.js
          grep -q 'noopener noreferrer' website/kota-kabupaten/portal.js
          grep -q 'communityVideoGrid' website/index.html
          grep -q 'communityChatForm' website/index.html
          grep -q 'regional_featured_content' website/kota-kabupaten/admin.js
          grep -q 'human review' website/kota-kabupaten/admin.js || grep -q 'Catatan verifikasi manusia' website/kota-kabupaten/admin.js
      - name: Check RLS and moderation safeguards
        run: |
          grep -q 'force row level security' supabase/migrations/202610220005_community_chat_and_video.sql
          grep -q 'chat messages member read' supabase/migrations/202610220005_community_chat_and_video.sql
          grep -q 'public geographic directory' supabase/migrations/202610220005_community_chat_and_video.sql
          grep -q 'enforce_community_video_workflow' supabase/migrations/202610220006_regional_video_moderation.sql
          grep -q 'video reviewer update scoped queue' supabase/migrations/202610220006_regional_video_moderation.sql
          grep -q 'assigned territory' supabase/migrations/202610220007_video_submission_scope.sql || grep -q 'video author submit draft' supabase/migrations/202610220007_video_submission_scope.sql
          git diff --check
